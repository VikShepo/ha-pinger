<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Network Control Center · Vorschau</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23a6b5ff'/%3E%3Cpath d='M5 12h4l2-6 3 12 2-6h3' fill='none' stroke='%23151b28' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--primary-color:#03a9f4;--primary-background-color:#fafafa;--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#606060;--divider-color:#e0e0e0;--success-color:#2e7d32;--error-color:#db4437;--warning-color:#ffa600;--text-primary-color:#fff;--ha-card-border-radius:12px;--ha-font-family-body:Roboto,Arial,sans-serif}
    :root[data-theme=dark]{color-scheme:dark;--primary-background-color:#111;--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#b3b3b3;--divider-color:#383838;--success-color:#66bb6a;--error-color:#ef5350}
    *{box-sizing:border-box}body{margin:0;background:var(--primary-background-color);color:var(--primary-text-color);font-family:var(--ha-font-family-body)}.demo{padding:8px 16px;background:var(--card-background-color);color:var(--secondary-text-color);display:flex;gap:12px;align-items:center;justify-content:center;font-size:11px;border-bottom:1px solid var(--divider-color)}.demo button{border:1px solid var(--divider-color);border-radius:8px;padding:6px 10px;background:transparent;color:var(--primary-color);cursor:pointer;white-space:nowrap}.compact-preview{max-width:460px;margin:45px auto;padding:15px}ha-pinger-panel{min-height:calc(100vh - 45px)}
  </style>
</head>
<body>
  <div class="demo"><span>DESIGN-VORSCHAU · Simulierte Daten und Push-Meldungen · Keine Verbindung zu deinem Heimnetz</span><button id="theme-toggle" type="button">Dunkelmodus</button></div>
  <div id="app"></div>
  <script type="module" src="demo.js"></script>
</body>
</html>
