name: Test and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: addons/ncc_vpn/go.mod
          cache-dependency-path: addons/ncc_vpn/go.sum
      - name: Install test dependencies
        run: |
          python -m pip install aiohttp==3.14.3 icmplib==3.0.4
          npm install --prefix .test-output/tools --no-save playwright@1.63.0
      - name: Python and installer checks
        run: |
          python -m unittest discover -s tests -v
          sh tests/test_install.sh
          node --check custom_components/ha_pinger/frontend/ha-pinger.js
      - name: Desktop and mobile checks
        env:
          PINGER_CHROME: /usr/bin/google-chrome
        run: node tools/ui_smoke.mjs
      - name: WireGuard checks
        working-directory: addons/ncc_vpn
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/ncc-vpn-arm64 .
      - name: Build and verify package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python tools/build.py
          python tools/validate_release.py
      - name: Build WireGuard container
        run: docker build --tag ncc-vpn-test addons/ncc_vpn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/build.py
          python tools/validate_release.py
          gh release create "$RELEASE_TAG" "dist/HA-Pinger-Control-Center-${RELEASE_TAG#v}.zip" --verify-tag --title "Network Control Center $RELEASE_TAG" --notes-file RELEASE_NOTES.md
